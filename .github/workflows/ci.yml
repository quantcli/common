name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main: with `branches: [main]`
  # a PR stacked on another PR's branch got no CI at all, so code could reach
  # main through a chain where it was never linted or tested on its own.
  pull_request:

# Default-deny at workflow level; jobs grant only what they need.
permissions: {}

jobs:
  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16.0.0
        with:
          globs: '**/*.md'

  go:
    name: go vet + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - id: detect
        name: detect go module
        run: |
          if [ -f go.mod ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod present; skipping go vet and go test."
          fi
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        if: steps.detect.outputs.has_go == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        if: steps.detect.outputs.has_go == 'true'
        run: go vet ./...
      - name: go test
        if: steps.detect.outputs.has_go == 'true'
        run: go test ./...

  compat:
    name: compat module (vet + self-test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - id: detect
        name: detect compat module
        run: |
          if [ -f compat/go.mod ]; then
            echo "has_compat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_compat=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No compat/go.mod present; skipping compat job."
          fi
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        if: steps.detect.outputs.has_compat == 'true'
        with:
          go-version-file: compat/go.mod
          # compat is stdlib-only; no module cache needed.
          cache: false
      - name: go vet (compat)
        if: steps.detect.outputs.has_compat == 'true'
        working-directory: compat
        run: go vet ./...
      - name: gofmt (compat)
        if: steps.detect.outputs.has_compat == 'true'
        working-directory: compat
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt diff in:"
            echo "$diff"
            echo "---"
            gofmt -d .
            exit 1
          fi
      - name: go test (compat self-test)
        if: steps.detect.outputs.has_compat == 'true'
        working-directory: compat
        run: go test ./...

  tools:
    name: tools module (vet + gofmt + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # tools is stdlib-only and analyses nothing we ship, so it is not
          # bound by the go.mod pin the security.yml scanners use. The
          # `// quantcli:not-shipped` marker in tools/go.mod is what makes that
          # freedom safe — without it, raising the directive there would drag
          # the scanning toolchain along with it (QUA-99).
          go-version: stable
          cache: false
      # These tests are the regression coverage for the security controls we
      # cannot reproduce on demand: the scan-freshness checker's failure modes
      # (cron auto-disabled for inactivity, deleted workflow, stale run,
      # unreadable repo), and security.yml's own module discovery and
      # version-file selection, which tools/securityworkflow runs against
      # synthetic repository trees. tools/workflowtriggers adds the rule that no
      # workflow in this repo may filter `pull_request` by base branch, which is
      # how a stacked PR used to merge with no checks at all (QUA-115). A change
      # that stops detecting one of them fails here.
      - name: go vet (tools)
        working-directory: tools
        run: go vet ./...
      - name: gofmt (tools)
        working-directory: tools
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt diff in:"
            echo "$diff"
            echo "---"
            gofmt -d .
            exit 1
          fi
      - name: go test (tools)
        working-directory: tools
        run: go test ./...
