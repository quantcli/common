# scan-freshness.yml — lives only in quantcli/common. Unlike security.yml this
# workflow is NOT copied into the export-clis: one watcher sweeps the whole org.
#
# What it watches: GitHub disables `schedule:` triggers in a public repo after
# 60 days with no repository activity, and tells you by email rather than by
# failing anything. That turns the daily security.yml re-scan into a control
# which switches itself off in precisely the case it was built for — a quiet
# repo — while the Actions tab keeps showing green, because the last run that
# ever happened was green. This job turns that silence into a red build.
#
# It also catches the neighbouring failure modes for free: a deleted or renamed
# security.yml, a repo onboarded without one, a repo we cannot read, and a
# default-branch scan that is failing rather than merely absent.

name: scan freshness

on:
  # One hour and change after the daily security.yml cron at 06:17 UTC, so a
  # scan that started on time has finished before we judge it.
  schedule:
    - cron: '42 7 * * *'
  workflow_dispatch:
    inputs:
      max-age-hours:
        description: 'Override the freshness window in hours. Set to 0.01 to prove the check can still go red (negative test).'
        required: false
        default: ''
  # Run on PRs that touch the checker or its policy: this is the only trigger
  # that exercises the live API path before a change to it reaches the cron.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scan-freshness.yml'
      - '.github/scan-freshness.json'
      - 'tools/**'

# Default-deny at workflow level; each job re-grants only what it needs.
permissions: {}

concurrency:
  group: scan-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: security scan freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          # tools/ is stdlib-only and analyses nothing we ship, so it is not
          # bound by the go.mod pin the security.yml scanners use.
          go-version: stable
          cache: false

      - name: Check scan freshness across the org
        env:
          # Reads public Actions metadata in sibling quantcli repos. If GitHub
          # ever narrows the default token such that cross-repo reads 404, the
          # check fails loudly as `unreadable` rather than passing quietly;
          # the fix is a read-only fine-grained PAT with Actions:read in the
          # SCAN_FRESHNESS_TOKEN secret, which the tool prefers when present.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_FRESHNESS_TOKEN: ${{ secrets.SCAN_FRESHNESS_TOKEN }}
          # Quoted, never interpolated into the command line, so a malformed
          # dispatch input cannot become shell.
          MAX_AGE_OVERRIDE: ${{ inputs.max-age-hours }}
        working-directory: tools
        run: |
          set -euo pipefail
          args=(-config ../.github/scan-freshness.json -summary "$RUNNER_TEMP/freshness.md")
          if [ -n "${MAX_AGE_OVERRIDE:-}" ]; then
            args+=(-max-age-hours "$MAX_AGE_OVERRIDE")
          fi
          go run ./scanfreshness "${args[@]}"

      - name: Publish report to the run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/freshness.md" ]; then
            cat "$RUNNER_TEMP/freshness.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The freshness check did not produce a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

  alert:
    name: open or update the alert issue
    needs: freshness
    # Only the unattended path alerts. A red PR or a hand-dispatched negative
    # test is already in front of a human.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: stable
          cache: false

      # Re-run rather than hand the report over as an artifact: it keeps the
      # token-reading job at `contents: read` and the issue-writing job out of
      # the scanning business, and it costs ~10 API calls on the days we are
      # already in trouble. If the state has recovered in between, the rerun
      # passes and no issue is filed.
      - name: Re-check and capture the report
        id: recheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_FRESHNESS_TOKEN: ${{ secrets.SCAN_FRESHNESS_TOKEN }}
        working-directory: tools
        run: |
          set -uo pipefail
          if go run ./scanfreshness -config ../.github/scan-freshness.json -summary "$RUNNER_TEMP/freshness.md"; then
            echo "still_failing=false" >> "$GITHUB_OUTPUT"
          else
            echo "still_failing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the alert issue
        if: steps.recheck.outputs.still_failing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Security scan freshness check failed'
          body="$RUNNER_TEMP/issue.md"
          {
            echo "One or more quantcli repos do not currently have a fresh, successful \`security.yml\` run."
            echo
            echo "This issue is filed automatically by [\`scan-freshness.yml\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/.github/workflows/scan-freshness.yml)."
            echo "It contains scan *coverage* status only — never vulnerability details."
            echo "Close it once every row below reads PASS; the next scheduled run will reopen the alert if the gap returns."
            echo
            echo "Failing run: ${RUN_URL}"
            echo
            cat "$RUNNER_TEMP/freshness.md"
          } > "$body"

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
